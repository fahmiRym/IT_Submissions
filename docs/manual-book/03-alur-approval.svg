<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
    <style>
      .title    { font-size: 26px; font-weight: 700; fill: #1e3a8a; }
      .subtitle { font-size: 14px; fill: #64748b; }
      .box-pengaju { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; }
      .box-spv     { fill: #ede9fe; stroke: #7c3aed; stroke-width: 2; }
      .box-kabag   { fill: #fce7f3; stroke: #db2777; stroke-width: 2; }
      .box-manager { fill: #ffe4e6; stroke: #e11d48; stroke-width: 2; }
      .box-acc     { fill: #ecfeff; stroke: #0891b2; stroke-width: 2; }
      .box-it      { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; }
      .box-reject  { fill: #fee2e2; stroke: #dc2626; stroke-width: 2; }
      .box-note    { fill: #fef3c7; stroke: #d97706; stroke-width: 1.5; }
      .lbl-title { font-size: 14px; font-weight: 700; fill: #0f172a; }
      .lbl-desc  { font-size: 11px; fill: #334155; }
      .lbl-small { font-size: 10px; fill: #475569; }
      .lbl-arrow { font-size: 11px; fill: #475569; font-style: italic; }
      .lbl-step  { font-size: 20px; font-weight: 700; fill: #94a3b8; }
      .legend    { font-size: 11px; fill: #334155; }
    </style>
  </defs>

  <text x="600" y="40" text-anchor="middle" class="title">3. ALUR PERSETUJUAN BERJENJANG</text>
  <text x="600" y="62" text-anchor="middle" class="subtitle">Perjalanan pengajuan dari SPV → Kabag → Manager → (Accounting) → Departemen IT</text>

  <!-- Actor Row: Pengaju (start) -->
  <rect x="40" y="130" width="150" height="90" rx="10" class="box-pengaju" filter="url(#sh)"/>
  <text x="115" y="152" text-anchor="middle" class="lbl-step">0</text>
  <text x="115" y="175" text-anchor="middle" class="lbl-title">Pemohon (Anda)</text>
  <text x="115" y="195" text-anchor="middle" class="lbl-desc">Submit pengajuan</text>
  <text x="115" y="211" text-anchor="middle" class="lbl-small">TTD otomatis (QR)</text>

  <line x1="190" y1="175" x2="240" y2="175" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <text x="215" y="167" text-anchor="middle" class="lbl-small">notif</text>

  <!-- SPV -->
  <rect x="240" y="130" width="150" height="90" rx="10" class="box-spv" filter="url(#sh)"/>
  <text x="315" y="152" text-anchor="middle" class="lbl-step">1</text>
  <text x="315" y="175" text-anchor="middle" class="lbl-title">SPV</text>
  <text x="315" y="195" text-anchor="middle" class="lbl-desc">Review + TTD digital</text>
  <text x="315" y="211" text-anchor="middle" class="lbl-small">bisa didelegasikan</text>

  <line x1="390" y1="175" x2="440" y2="175" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <text x="415" y="167" text-anchor="middle" class="lbl-small">notif</text>

  <!-- Kabag -->
  <rect x="440" y="130" width="150" height="90" rx="10" class="box-kabag" filter="url(#sh)"/>
  <text x="515" y="152" text-anchor="middle" class="lbl-step">2</text>
  <text x="515" y="175" text-anchor="middle" class="lbl-title">Kabag</text>
  <text x="515" y="195" text-anchor="middle" class="lbl-desc">Review + TTD digital</text>
  <text x="515" y="211" text-anchor="middle" class="lbl-small">bisa didelegasikan ke SPV</text>

  <line x1="590" y1="175" x2="640" y2="175" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <text x="615" y="167" text-anchor="middle" class="lbl-small">notif</text>

  <!-- Manager -->
  <rect x="640" y="130" width="150" height="90" rx="10" class="box-manager" filter="url(#sh)"/>
  <text x="715" y="152" text-anchor="middle" class="lbl-step">3</text>
  <text x="715" y="175" text-anchor="middle" class="lbl-title">Manager</text>
  <text x="715" y="195" text-anchor="middle" class="lbl-desc">Review + TTD digital</text>
  <text x="715" y="211" text-anchor="middle" class="lbl-small">bisa didelegasikan ke Asisten</text>

  <line x1="790" y1="175" x2="840" y2="175" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <text x="815" y="167" text-anchor="middle" class="lbl-small">notif</text>

  <!-- Accounting (conditional) -->
  <rect x="840" y="130" width="150" height="90" rx="10" class="box-acc" filter="url(#sh)"/>
  <text x="915" y="152" text-anchor="middle" class="lbl-step">4</text>
  <text x="915" y="175" text-anchor="middle" class="lbl-title">Accounting</text>
  <text x="915" y="195" text-anchor="middle" class="lbl-desc">HANYA untuk Adjustment</text>
  <text x="915" y="211" text-anchor="middle" class="lbl-small">jenis lain: dilewati</text>

  <line x1="990" y1="175" x2="1040" y2="175" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <text x="1015" y="167" text-anchor="middle" class="lbl-small">notif</text>

  <!-- Dept IT -->
  <rect x="1040" y="130" width="150" height="90" rx="10" class="box-it" filter="url(#sh)"/>
  <text x="1115" y="152" text-anchor="middle" class="lbl-step">5</text>
  <text x="1115" y="175" text-anchor="middle" class="lbl-title">Departemen IT</text>
  <text x="1115" y="195" text-anchor="middle" class="lbl-desc">TTD Final</text>
  <text x="1115" y="211" text-anchor="middle" class="lbl-small">generate Nomor Dokumen</text>

  <!-- Section: what each approver can do -->
  <text x="600" y="270" text-anchor="middle" class="lbl-title">Di setiap tahap, approver membuka Inbox → memilih pengajuan → melihat 2 tombol:</text>

  <!-- Approve button -->
  <rect x="220" y="290" width="340" height="80" rx="10" class="box-it" filter="url(#sh)"/>
  <text x="390" y="315" text-anchor="middle" class="lbl-title">TOMBOL HIJAU: "SETUJUI + TTD"</text>
  <text x="390" y="337" text-anchor="middle" class="lbl-desc">→ TTD digital (QR) otomatis dibubuhkan</text>
  <text x="390" y="355" text-anchor="middle" class="lbl-desc">→ Pengajuan LANJUT ke approver berikutnya</text>

  <!-- Reject button -->
  <rect x="620" y="290" width="360" height="80" rx="10" class="box-reject" filter="url(#sh)"/>
  <text x="800" y="315" text-anchor="middle" class="lbl-title">TOMBOL MERAH: "TOLAK / REJECT"</text>
  <text x="800" y="337" text-anchor="middle" class="lbl-desc">→ Approver WAJIB isi alasan penolakan</text>
  <text x="800" y="355" text-anchor="middle" class="lbl-desc">→ Pengajuan KEMBALI ke Pemohon dgn status "Ditolak"</text>

  <!-- Reject path arrows -->
  <path d="M 800,370 L 800,420 L 115,420 L 115,220" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,4" fill="none" marker-end="url(#arr-red)"/>
  <text x="450" y="415" text-anchor="middle" class="lbl-arrow" fill="#991b1b">Jika DITOLAK → balik ke Anda, edit lagi &amp; submit ulang</text>

  <!-- Delegasi TTD block -->
  <rect x="60" y="470" width="540" height="150" rx="10" class="box-note" filter="url(#sh)"/>
  <text x="330" y="497" text-anchor="middle" class="lbl-title">DELEGASI TTD (Wakil Tanda Tangan)</text>
  <text x="330" y="520" text-anchor="middle" class="lbl-desc">Kalau atasan cuti / dinas luar, TTD bisa diwakilkan:</text>
  <text x="330" y="540" text-anchor="middle" class="lbl-desc">• Kabag → SPV di dept-nya</text>
  <text x="330" y="558" text-anchor="middle" class="lbl-desc">• Manager → Asisten Manager</text>
  <text x="330" y="576" text-anchor="middle" class="lbl-desc">Diatur di menu Profil → "Aktifkan Delegasi" dgn tanggal mulai &amp; berakhir</text>
  <text x="330" y="600" text-anchor="middle" class="lbl-small" fill="#7c2d12">Di dokumen final: tercatat "TTD atas nama [nama asli] oleh [pengganti]"</text>

  <!-- Timer / SLA note -->
  <rect x="620" y="470" width="530" height="150" rx="10" class="box-note" filter="url(#sh)"/>
  <text x="885" y="497" text-anchor="middle" class="lbl-title">STATUS YANG BISA ANDA LIHAT</text>
  <text x="640" y="522" class="lbl-desc">🟠 <tspan font-weight="700">Menunggu Persetujuan [Role]</tspan> — sedang di-review approver</text>
  <text x="640" y="542" class="lbl-desc">🟢 <tspan font-weight="700">Disetujui Penuh (Done)</tspan> — semua tahap sudah TTD, dokumen jadi</text>
  <text x="640" y="562" class="lbl-desc">🔴 <tspan font-weight="700">Ditolak</tspan> — dikembalikan dgn catatan alasan</text>
  <text x="640" y="582" class="lbl-desc">⚪ <tspan font-weight="700">Void</tspan> — dibatalkan oleh sistem/superadmin</text>
  <text x="640" y="605" class="lbl-small">Klik pengajuan → tab "Riwayat Approval" untuk lihat siapa sudah TTD</text>

  <!-- Legend row -->
  <rect x="60"   y="680" width="16" height="16" class="box-pengaju"/><text x="82"  y="693" class="legend">Pemohon</text>
  <rect x="150"  y="680" width="16" height="16" class="box-spv"/>    <text x="172" y="693" class="legend">SPV</text>
  <rect x="220"  y="680" width="16" height="16" class="box-kabag"/>  <text x="242" y="693" class="legend">Kabag</text>
  <rect x="300"  y="680" width="16" height="16" class="box-manager"/><text x="322" y="693" class="legend">Manager</text>
  <rect x="390"  y="680" width="16" height="16" class="box-acc"/>    <text x="412" y="693" class="legend">Accounting</text>
  <rect x="490"  y="680" width="16" height="16" class="box-it"/>     <text x="512" y="693" class="legend">Departemen IT (final)</text>
  <rect x="660"  y="680" width="16" height="16" class="box-reject"/> <text x="682" y="693" class="legend">Ditolak</text>
  <line x1="760" y1="688" x2="800" y2="688" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="808" y="693" class="legend">Jalur Reject</text>

  <text x="600" y="770" text-anchor="middle" class="subtitle">Manual Book IT Submission — Halaman 3 dari 5</text>
</svg>
