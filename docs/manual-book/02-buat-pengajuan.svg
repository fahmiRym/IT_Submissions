<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
    <style>
      .title    { font-size: 26px; font-weight: 700; fill: #1e3a8a; }
      .subtitle { font-size: 14px; fill: #64748b; }
      .box-user   { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; }
      .box-form   { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2; }
      .box-system { fill: #f1f5f9; stroke: #64748b; stroke-width: 2; }
      .box-wait   { fill: #fed7aa; stroke: #ea580c; stroke-width: 2; }
      .box-done   { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; }
      .box-jenis  { fill: #fef3c7; stroke: #d97706; stroke-width: 1.5; }
      .lbl-title { font-size: 14px; font-weight: 700; fill: #0f172a; }
      .lbl-desc  { font-size: 11px; fill: #334155; }
      .lbl-small { font-size: 10px; fill: #475569; }
      .lbl-arrow { font-size: 11px; fill: #475569; font-style: italic; }
      .legend    { font-size: 11px; fill: #334155; }
    </style>
  </defs>

  <text x="500" y="40" text-anchor="middle" class="title">2. BUAT PENGAJUAN BARU</text>
  <text x="500" y="62" text-anchor="middle" class="subtitle">Cara membuat pengajuan (Cancel, Adjustment, Mutasi, Internal Memo, Bundel) sampai terkirim</text>

  <!-- Step 1: Menu Dashboard -->
  <rect x="60" y="100" width="180" height="70" rx="10" class="box-user" filter="url(#sh)"/>
  <text x="150" y="128" text-anchor="middle" class="lbl-title">1. Klik Menu</text>
  <text x="150" y="148" text-anchor="middle" class="lbl-desc">Dashboard →</text>
  <text x="150" y="163" text-anchor="middle" class="lbl-desc">"Buat Pengajuan"</text>

  <line x1="240" y1="135" x2="320" y2="135" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 2: Pilih Jenis -->
  <rect x="330" y="100" width="180" height="70" rx="10" class="box-user" filter="url(#sh)"/>
  <text x="420" y="128" text-anchor="middle" class="lbl-title">2. Pilih Jenis</text>
  <text x="420" y="148" text-anchor="middle" class="lbl-desc">6 jenis tersedia</text>
  <text x="420" y="163" text-anchor="middle" class="lbl-desc">(lihat di bawah)</text>

  <line x1="510" y1="135" x2="590" y2="135" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 3: Isi Form -->
  <rect x="600" y="100" width="180" height="70" rx="10" class="box-form" filter="url(#sh)"/>
  <text x="690" y="128" text-anchor="middle" class="lbl-title">3. Isi Form</text>
  <text x="690" y="148" text-anchor="middle" class="lbl-desc">Tanggal, dept, produk,</text>
  <text x="690" y="163" text-anchor="middle" class="lbl-desc">jumlah, keterangan</text>

  <line x1="780" y1="135" x2="860" y2="135" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 4: Upload -->
  <rect x="810" y="100" width="140" height="70" rx="10" class="box-form" filter="url(#sh)"/>
  <text x="880" y="128" text-anchor="middle" class="lbl-title">4. Lampiran</text>
  <text x="880" y="148" text-anchor="middle" class="lbl-desc">Upload PDF/foto</text>
  <text x="880" y="163" text-anchor="middle" class="lbl-desc">(opsional)</text>

  <!-- turn down -->
  <path d="M 880,170 L 880,210 L 500,210 L 500,240" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- Jenis Pengajuan detail row -->
  <text x="500" y="260" text-anchor="middle" class="lbl-title">Jenis Pengajuan (pilih salah satu di langkah 2):</text>

  <g transform="translate(50, 275)">
    <rect x="0" y="0" width="145" height="70" rx="8" class="box-jenis"/>
    <text x="72" y="20" text-anchor="middle" class="lbl-title">Cancel</text>
    <text x="72" y="40" text-anchor="middle" class="lbl-small">Batal transaksi</text>
    <text x="72" y="55" text-anchor="middle" class="lbl-small">Nomor: CANCEL/mm/IT/yy</text>
  </g>
  <g transform="translate(205, 275)">
    <rect x="0" y="0" width="145" height="70" rx="8" class="box-jenis"/>
    <text x="72" y="20" text-anchor="middle" class="lbl-title">Adjustment</text>
    <text x="72" y="40" text-anchor="middle" class="lbl-small">Penyesuaian stok</text>
    <text x="72" y="55" text-anchor="middle" class="lbl-small">Nomor: DC/yy/mm/dd/xxxx</text>
  </g>
  <g transform="translate(360, 275)">
    <rect x="0" y="0" width="145" height="70" rx="8" class="box-jenis"/>
    <text x="72" y="20" text-anchor="middle" class="lbl-title">Mutasi Billet</text>
    <text x="72" y="40" text-anchor="middle" class="lbl-small">Pindah stok billet</text>
    <text x="72" y="55" text-anchor="middle" class="lbl-small">Nomor: DCB/yy/mm/xxxx</text>
  </g>
  <g transform="translate(515, 275)">
    <rect x="0" y="0" width="145" height="70" rx="8" class="box-jenis"/>
    <text x="72" y="20" text-anchor="middle" class="lbl-title">Mutasi Produk</text>
    <text x="72" y="40" text-anchor="middle" class="lbl-small">Pindah stok produk</text>
    <text x="72" y="55" text-anchor="middle" class="lbl-small">Nomor: RPP/yy/mm/xxxx</text>
  </g>
  <g transform="translate(670, 275)">
    <rect x="0" y="0" width="145" height="70" rx="8" class="box-jenis"/>
    <text x="72" y="20" text-anchor="middle" class="lbl-title">Internal Memo</text>
    <text x="72" y="40" text-anchor="middle" class="lbl-small">Memo antar dept</text>
    <text x="72" y="55" text-anchor="middle" class="lbl-small">Nomor: IM/yy/mm/xxxx</text>
  </g>
  <g transform="translate(825, 275)">
    <rect x="0" y="0" width="130" height="70" rx="8" class="box-jenis"/>
    <text x="65" y="20" text-anchor="middle" class="lbl-title">Bundel</text>
    <text x="65" y="40" text-anchor="middle" class="lbl-small">Gabung dokumen</text>
    <text x="65" y="55" text-anchor="middle" class="lbl-small">Nomor: BDL/yy/mm/xxxx</text>
  </g>

  <!-- Step 5: Review -->
  <rect x="400" y="390" width="200" height="80" rx="10" class="box-user" filter="url(#sh)"/>
  <text x="500" y="418" text-anchor="middle" class="lbl-title">5. Preview &amp; Cek Ulang</text>
  <text x="500" y="440" text-anchor="middle" class="lbl-desc">Pastikan semua data benar</text>
  <text x="500" y="458" text-anchor="middle" class="lbl-desc">(TIDAK BISA diedit setelah submit)</text>

  <line x1="500" y1="470" x2="500" y2="510" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 6: Klik SUBMIT -->
  <rect x="400" y="520" width="200" height="60" rx="10" class="box-user" filter="url(#sh)"/>
  <text x="500" y="548" text-anchor="middle" class="lbl-title">6. Klik SUBMIT / KIRIM</text>
  <text x="500" y="568" text-anchor="middle" class="lbl-desc">Tombol biru di bawah form</text>

  <line x1="500" y1="580" x2="500" y2="620" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 7: Sistem proses -->
  <rect x="60" y="620" width="880" height="80" rx="10" class="box-system" filter="url(#sh)"/>
  <text x="500" y="648" text-anchor="middle" class="lbl-title">7. SISTEM MEMPROSES OTOMATIS</text>
  <text x="180" y="678" text-anchor="middle" class="lbl-desc">• Simpan pengajuan</text>
  <text x="380" y="678" text-anchor="middle" class="lbl-desc">• Bubuhkan TTD Anda (QR)</text>
  <text x="600" y="678" text-anchor="middle" class="lbl-desc">• Kirim notifikasi ke SPV</text>
  <text x="810" y="678" text-anchor="middle" class="lbl-desc">• Status: MENUNGGU SPV</text>

  <!-- Result box -->
  <rect x="700" y="390" width="240" height="80" rx="10" class="box-wait" filter="url(#sh)"/>
  <text x="820" y="418" text-anchor="middle" class="lbl-title">Status Awal</text>
  <text x="820" y="440" text-anchor="middle" class="lbl-desc">"Menunggu Persetujuan SPV"</text>
  <text x="820" y="458" text-anchor="middle" class="lbl-desc">Lihat di Daftar Pengajuan Saya</text>

  <path d="M 600,430 L 700,430" stroke="#333" stroke-width="1.5" stroke-dasharray="4,3" fill="none" marker-end="url(#arr)"/>

  <!-- Tips box -->
  <rect x="60" y="390" width="320" height="80" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="220" y="410" text-anchor="middle" class="lbl-title" fill="#991b1b">⚠ Sebelum Submit — Cek:</text>
  <text x="220" y="430" text-anchor="middle" class="lbl-desc">✓ Nomor transaksi sudah benar</text>
  <text x="220" y="446" text-anchor="middle" class="lbl-desc">✓ Jumlah &amp; keterangan lengkap</text>
  <text x="220" y="462" text-anchor="middle" class="lbl-desc">✓ Lampiran (jika perlu) sudah ter-upload</text>

  <!-- Legend -->
  <rect x="60" y="740" width="16" height="16" class="box-user"/><text x="82" y="753" class="legend">Aksi Anda</text>
  <rect x="150" y="740" width="16" height="16" class="box-form"/><text x="172" y="753" class="legend">Isi Form</text>
  <rect x="230" y="740" width="16" height="16" class="box-jenis"/><text x="252" y="753" class="legend">Jenis Pengajuan</text>
  <rect x="360" y="740" width="16" height="16" class="box-system"/><text x="382" y="753" class="legend">Proses Sistem</text>
  <rect x="480" y="740" width="16" height="16" class="box-wait"/><text x="502" y="753" class="legend">Menunggu</text>

  <text x="500" y="783" text-anchor="middle" class="subtitle">Manual Book IT Submission — Halaman 2 dari 5</text>
</svg>
