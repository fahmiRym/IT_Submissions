<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
    <style>
      .title    { font-size: 26px; font-weight: 700; fill: #1e3a8a; }
      .subtitle { font-size: 14px; fill: #64748b; }
      .box-user   { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; }
      .box-system { fill: #f1f5f9; stroke: #64748b; stroke-width: 2; }
      .box-notif  { fill: #fef3c7; stroke: #d97706; stroke-width: 2; }
      .box-phone  { fill: #ecfdf5; stroke: #059669; stroke-width: 2; }
      .box-web    { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2; }
      .lbl-title { font-size: 14px; font-weight: 700; fill: #0f172a; }
      .lbl-desc  { font-size: 11px; fill: #334155; }
      .lbl-small { font-size: 10px; fill: #475569; }
      .lbl-arrow { font-size: 11px; fill: #475569; font-style: italic; }
      .legend    { font-size: 11px; fill: #334155; }
    </style>
  </defs>

  <text x="500" y="40" text-anchor="middle" class="title">4. NOTIFIKASI &amp; MELACAK STATUS</text>
  <text x="500" y="62" text-anchor="middle" class="subtitle">Cara tahu pengajuan sudah sampai mana + notifikasi otomatis ke HP dan web</text>

  <!-- 3 kejadian trigger notifikasi -->
  <text x="500" y="105" text-anchor="middle" class="lbl-title">KAPAN NOTIFIKASI DIKIRIM?</text>

  <g transform="translate(50, 125)">
    <rect x="0" y="0" width="280" height="110" rx="10" class="box-notif" filter="url(#sh)"/>
    <text x="140" y="25" text-anchor="middle" class="lbl-title">📥 Untuk Approver</text>
    <text x="140" y="50" text-anchor="middle" class="lbl-desc">"Menunggu Persetujuan Anda"</text>
    <text x="140" y="70" text-anchor="middle" class="lbl-small">Dikirim ke SPV/Kabag/Manager saat</text>
    <text x="140" y="86" text-anchor="middle" class="lbl-small">giliran-nya untuk TTD</text>
    <text x="140" y="102" text-anchor="middle" class="lbl-small">Contoh: "Menunggu TTD Kabag Produksi"</text>
  </g>

  <g transform="translate(360, 125)">
    <rect x="0" y="0" width="280" height="110" rx="10" class="box-phone" filter="url(#sh)"/>
    <text x="140" y="25" text-anchor="middle" class="lbl-title">✅ Untuk Pemohon (Sukses)</text>
    <text x="140" y="50" text-anchor="middle" class="lbl-desc">"Pengajuan Disetujui Penuh"</text>
    <text x="140" y="70" text-anchor="middle" class="lbl-small">Dikirim saat SEMUA approver</text>
    <text x="140" y="86" text-anchor="middle" class="lbl-small">termasuk Departemen IT sudah TTD</text>
    <text x="140" y="102" text-anchor="middle" class="lbl-small">Pengajuan resmi jadi ARSIP</text>
  </g>

  <g transform="translate(670, 125)">
    <rect x="0" y="0" width="280" height="110" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2" filter="url(#sh)"/>
    <text x="140" y="25" text-anchor="middle" class="lbl-title" fill="#991b1b">❌ Untuk Pemohon (Ditolak)</text>
    <text x="140" y="50" text-anchor="middle" class="lbl-desc">"Pengajuan Ditolak"</text>
    <text x="140" y="70" text-anchor="middle" class="lbl-small">Dikirim saat ada approver klik Reject</text>
    <text x="140" y="86" text-anchor="middle" class="lbl-small">Isi notif: nama approver, tahap,</text>
    <text x="140" y="102" text-anchor="middle" class="lbl-small">dan alasan penolakan</text>
  </g>

  <!-- 2 tempat notifikasi muncul -->
  <text x="500" y="275" text-anchor="middle" class="lbl-title">DI MANA NOTIFIKASI MUNCUL?</text>

  <!-- Web: Bell icon -->
  <g transform="translate(60, 295)">
    <rect x="0" y="0" width="400" height="200" rx="10" class="box-web" filter="url(#sh)"/>
    <text x="200" y="25" text-anchor="middle" class="lbl-title">🔔 A. Web (Browser)</text>
    <text x="200" y="48" text-anchor="middle" class="lbl-desc">Icon bel di pojok kanan atas dashboard</text>

    <!-- mock bell -->
    <circle cx="70" cy="105" r="25" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="70" y="112" text-anchor="middle" font-size="20">🔔</text>
    <circle cx="88" cy="87" r="10" fill="#dc2626"/>
    <text x="88" y="91" text-anchor="middle" font-size="10" fill="white" font-weight="700">3</text>

    <text x="120" y="90" class="lbl-desc" font-weight="700">Badge merah</text>
    <text x="120" y="106" class="lbl-small">= jumlah notif belum dibaca</text>
    <text x="120" y="130" class="lbl-desc" font-weight="700">Klik untuk buka daftar</text>
    <text x="120" y="146" class="lbl-small">Klik notif → langsung ke detail pengajuan</text>

    <text x="200" y="180" text-anchor="middle" class="lbl-small" fill="#1e40af">Notif tetap ada meski browser di-refresh</text>
    <text x="200" y="194" text-anchor="middle" class="lbl-small" fill="#1e40af">Bisa "Tandai Sudah Dibaca" satu per satu / semua</text>
  </g>

  <!-- Android: Push notification -->
  <g transform="translate(540, 295)">
    <rect x="0" y="0" width="400" height="200" rx="10" class="box-phone" filter="url(#sh)"/>
    <text x="200" y="25" text-anchor="middle" class="lbl-title">📱 B. Android (HP)</text>
    <text x="200" y="48" text-anchor="middle" class="lbl-desc">Push notification via IT Submission app</text>

    <!-- mock phone -->
    <rect x="30" y="70" width="90" height="120" rx="10" fill="#1f2937" stroke="#111"/>
    <rect x="35" y="80" width="80" height="90" fill="white"/>
    <rect x="42" y="88" width="66" height="35" fill="#dbeafe" stroke="#2563eb"/>
    <text x="75" y="99" text-anchor="middle" font-size="7" font-weight="700" fill="#1e3a8a">IT Submission</text>
    <text x="75" y="110" text-anchor="middle" font-size="6" fill="#334155">Menunggu Persetujuan</text>
    <text x="75" y="118" text-anchor="middle" font-size="6" fill="#334155">DC/2026/07/23/0001</text>
    <circle cx="75" cy="180" r="4" fill="none" stroke="white"/>

    <text x="145" y="95" class="lbl-desc" font-weight="700">Muncul di layar HP</text>
    <text x="145" y="111" class="lbl-small">Meski app tidak dibuka</text>
    <text x="145" y="127" class="lbl-desc" font-weight="700">Tap notif</text>
    <text x="145" y="143" class="lbl-small">→ buka app langsung ke detail</text>
    <text x="145" y="167" class="lbl-small" fill="#065f46">✓ Login sekali di app, notif aktif</text>
    <text x="145" y="181" class="lbl-small" fill="#065f46">✓ Bunyi + getar sesuai setting HP</text>
  </g>

  <!-- Track sendiri: daftar pengajuan -->
  <text x="500" y="540" text-anchor="middle" class="lbl-title">CARA LIHAT STATUS PENGAJUAN SENDIRI</text>

  <rect x="60" y="560" width="220" height="90" rx="10" class="box-user" filter="url(#sh)"/>
  <text x="170" y="585" text-anchor="middle" class="lbl-title">1. Buka menu</text>
  <text x="170" y="607" text-anchor="middle" class="lbl-desc">"Daftar Pengajuan Saya"</text>
  <text x="170" y="625" text-anchor="middle" class="lbl-small">di sidebar kiri</text>
  <text x="170" y="641" text-anchor="middle" class="lbl-small">atau tap kartu Dashboard</text>

  <line x1="280" y1="605" x2="340" y2="605" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="350" y="560" width="240" height="90" rx="10" class="box-user" filter="url(#sh)"/>
  <text x="470" y="585" text-anchor="middle" class="lbl-title">2. Filter / cari</text>
  <text x="470" y="607" text-anchor="middle" class="lbl-desc">Status: Menunggu/Done/Reject</text>
  <text x="470" y="625" text-anchor="middle" class="lbl-desc">Jenis: Cancel/Adjust/Mutasi/...</text>
  <text x="470" y="641" text-anchor="middle" class="lbl-small">atau search nomor transaksi</text>

  <line x1="590" y1="605" x2="650" y2="605" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="660" y="560" width="280" height="90" rx="10" class="box-system" filter="url(#sh)"/>
  <text x="800" y="585" text-anchor="middle" class="lbl-title">3. Klik baris pengajuan</text>
  <text x="800" y="607" text-anchor="middle" class="lbl-desc">→ Detail + tab "Riwayat Approval"</text>
  <text x="800" y="625" text-anchor="middle" class="lbl-desc">Lihat: siapa sudah TTD, timestamp,</text>
  <text x="800" y="641" text-anchor="middle" class="lbl-desc">catatan/alasan approver</text>

  <!-- Tips box -->
  <rect x="60" y="670" width="880" height="60" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="500" y="692" text-anchor="middle" class="lbl-title" fill="#991b1b">TIPS</text>
  <text x="500" y="712" text-anchor="middle" class="lbl-desc">Kalau tidak dapat notif di HP → cek Setting Android → Notifikasi → IT Submission → pastikan Aktif</text>

  <text x="500" y="763" text-anchor="middle" class="subtitle">Manual Book IT Submission — Halaman 4 dari 5</text>
</svg>
